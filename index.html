<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morgan Job Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17; --surface: #131a2b; --surface-2: #1a2340; --border: #243052;
  --text: #e8ecf4; --text-dim: #8892a8; --text-muted: #556180;
  --accent: #4de8b4; --accent-dim: #2a8c6a;
  --danger: #ff6b7a; --warning: #ffb84d;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; -webkit-font-smoothing:antialiased; }

.header {
  position:sticky; top:0; z-index:100;
  background:rgba(10,14,23,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); padding:16px 20px 12px;
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.logo { font-family:'DM Mono',monospace; font-weight:500; font-size:15px; letter-spacing:0.08em; color:var(--accent); text-transform:uppercase; }
.logo span { color:var(--text-dim); }
.tagline { font-size:11px; color:var(--text-muted); margin-top:4px; font-family:'DM Mono',monospace; }

.tabs { display:flex; gap:8px; margin-top:12px; overflow-x:auto; }
.tab {
  padding:8px 16px; border:1px solid var(--border); border-radius:8px;
  background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600;
  cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.tab.active { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.tab:active { transform:scale(0.97); }

.container { max-width:900px; margin:0 auto; padding:20px; }
.tab-content { display:none; }
.tab-content.active { display:block; }

.search-form {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:24px; margin-bottom:24px;
}

label {
  display:block; font-family:'DM Mono',monospace; font-size:11px;
  color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em;
}

input[type="text"], select, textarea {
  width:100%; padding:12px 14px; margin-bottom:18px;
  border:1px solid var(--border); border-radius:10px;
  background:var(--surface-2); color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:14px;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
textarea { min-height:180px; resize:vertical; line-height:1.6; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 24px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.btn-primary { background:var(--accent); color:var(--bg); border-color:var(--accent); width:100%; }
.btn-primary:active { background:var(--accent-dim); transform:scale(0.98); }
.btn-secondary { background:var(--surface-2); color:var(--text); border-color:var(--border); width:100%; margin-top:12px; }
.btn-secondary:active { background:var(--border); transform:scale(0.98); }
.btn:disabled { opacity:0.5; pointer-events:none; }

.results { margin-top:24px; }
.results h3 { font-size:15px; font-weight:600; margin-bottom:16px; }
.results ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:8px; }
.results li {
  background:var(--surface); padding:12px 14px; border-radius:10px;
  border:1px solid var(--border); display:flex; align-items:center; gap:12px;
}
.results li input[type="checkbox"] { cursor:pointer; width:16px; height:16px; }
.results li label { cursor:pointer; margin:0; flex:1; text-transform:none; font-size:14px; letter-spacing:0; }
.results li a { color:var(--text); text-decoration:none; transition:color 0.2s; }
.results li a:hover { color:var(--accent); }

.notice {
  background:var(--surface-2); padding:16px; border-radius:10px;
  border-left:3px solid var(--accent); margin:20px 0; font-size:13px; line-height:1.6;
}
.notice strong { color:var(--accent); }

.loading { text-align:center; padding:60px 20px; color:var(--text-dim); }
.spinner {
  width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;
}
@keyframes spin { to { transform:rotate(360deg); } }

.job-cards {
  display:grid; gap:16px; margin-top:20px;
}

.job-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:20px; transition:all 0.2s;
}

.job-card:hover {
  border-color:var(--accent); transform:translateY(-2px);
}

.job-title {
  font-size:16px; font-weight:600; margin-bottom:8px; color:var(--text);
}

.job-company {
  font-size:14px; color:var(--text-dim); margin-bottom:4px;
}

.job-location {
  font-size:12px; color:var(--text-muted); margin-bottom:8px;
}

.job-type {
  font-size:11px; color:var(--text-muted); margin-bottom:8px;
  font-family:'DM Mono',monospace;
}

.job-description-preview {
  font-size:12px; color:var(--text-dim); line-height:1.5;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--border);
}

.job-footer {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
}

.job-date {
  font-size:11px; color:var(--text-muted);
  font-family:'DM Mono',monospace;
}

.job-apply-btn {
  padding:8px 16px; background:var(--accent); color:var(--bg);
  border:none; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:all 0.2s;
}

.job-apply-btn:hover {
  background:var(--accent-dim);
}

.job-apply-btn.external {
  background:#ff6b7a; /* Red for external links */
}

.job-apply-btn.external:hover {
  background:#e05566;
}

.job-apply-btn.easy-apply {
  background:var(--accent); /* Teal/green for Easy Apply */
}

.job-apply-btn.easy-apply:hover {
  background:var(--accent-dim);
}

.optimized-section {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px; margin:20px 0;
}
.optimized-section h3 { font-size:15px; font-weight:600; margin-bottom:16px; color:var(--accent); }

.keyword-chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  padding:6px 12px; background:var(--accent); color:var(--bg);
  border-radius:6px; font-size:12px; font-weight:500; font-family:'DM Mono',monospace;
}

.job-title-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px; margin-bottom:16px;
}
.job-title-card h4 { font-size:16px; font-weight:600; margin-bottom:12px; }
.job-title-card .subtitle { font-size:12px; color:var(--text-muted); margin-bottom:14px; }

.ats-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px;
}
.ats-link {
  display:flex; align-items:center; justify-content:center; padding:10px 12px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  color:var(--text-dim); text-decoration:none; font-size:12px; font-weight:500;
  transition:all 0.2s; text-align:center;
}
.ats-link:hover { background:var(--border); color:var(--accent); border-color:var(--accent); }
.ats-link:active { transform:scale(0.97); }

footer {
  text-align:center; margin-top:60px; padding:30px 20px; border-top:1px solid var(--border);
  font-family:'DM Mono',monospace; font-size:11px; color:var(--text-muted);
}
footer a { color:var(--accent); text-decoration:none; }
footer a:hover { text-decoration:underline; text-underline-offset:2px; }

@media (min-width:640px) {
  .container { padding:32px 40px; }
  .search-form { padding:32px; }
  .ats-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">MORGAN <span>SEARCH</span></div>
      <div class="tagline">One-stop job search solution</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('aiml')">AI/ML Roles</button>
    <button class="tab" onclick="switchTab('gmp')">GMP/Pharma QA</button>
    <button class="tab" onclick="switchTab('optimizer')">AI Optimizer</button>
  </div>
</div>

<div class="container">
  
  <!-- TAB 1: AI/ML JOBS -->
  <div id="aiml-tab" class="tab-content active">
    <div class="search-form">
      <label>Job Title</label>
      <input type="text" id="aiml-jobTitle" placeholder="e.g., Machine Learning Engineer, LLM Engineer" />

      <label>Number of Jobs</label>
      <select id="aiml-jobCount">
        <option value="10">10 jobs</option>
        <option value="25" selected>25 jobs</option>
        <option value="50">50 jobs</option>
        <option value="75">75 jobs</option>
        <option value="100">100 jobs</option>
      </select>

      <label>Time Range</label>
      <select id="aiml-timeFilter">
        <option value="24hours" selected>Past 24 Hours</option>
        <option value="48hours">Past 48 Hours</option>
        <option value="week">Past Week</option>
      </select>

      <label>Location</label>
      <select id="aiml-locationFilter">
        <option value="usa" selected>United States</option>
        <option value="usa-remote">USA - Remote Only</option>
        <option value="nyc">New York</option>
        <option value="sf">San Francisco / Bay Area</option>
        <option value="boston">Boston</option>
        <option value="seattle">Seattle</option>
      </select>

      <button class="btn btn-primary" onclick="scrapeLinkedInJobs('aiml')">
        Scrape LinkedIn Jobs
      </button>
      
      <button class="btn btn-secondary" onclick="searchAllPlatforms('aiml')">
        Search All Platforms (Google + ATS)
      </button>
    </div>

    <div id="aiml-results" class="results"></div>
  </div>

  <!-- TAB 2: GMP/PHARMA QA JOBS -->
  <div id="gmp-tab" class="tab-content">
    <div class="search-form">
      <label>Role Type</label>
      <select id="gmp-roleType">
        <option value="qa-associate">QA Associate (Manufacturing Floor)</option>
        <option value="doc-control">Document Control Specialist</option>
        <option value="compliance">Compliance/Audit Specialist</option>
        <option value="qa-specialist">QA Specialist (General)</option>
        <option value="batch-release">Batch Release Specialist</option>
        <option value="custom">Custom Search</option>
      </select>

      <div id="gmp-custom-field" style="display:none;">
        <label>Custom Job Title</label>
        <input type="text" id="gmp-customTitle" placeholder="e.g., GMP Quality Specialist" />
      </div>

      <label>Number of Jobs</label>
      <select id="gmp-jobCount">
        <option value="10">10 jobs</option>
        <option value="25" selected>25 jobs</option>
        <option value="50">50 jobs</option>
        <option value="75">75 jobs</option>
        <option value="100">100 jobs</option>
      </select>

      <label>Time Range</label>
      <select id="gmp-timeFilter">
        <option value="24hours" selected>Past 24 Hours</option>
        <option value="48hours">Past 48 Hours</option>
        <option value="week">Past Week</option>
      </select>

      <label>Location</label>
      <select id="gmp-locationFilter">
        <option value="usa" selected>United States (All)</option>
        <option value="nj-philly">NJ / Philadelphia</option>
        <option value="research-triangle">Research Triangle, NC</option>
        <option value="boston">Boston / Cambridge, MA</option>
        <option value="houston">Houston, TX</option>
        <option value="maryland">Maryland / DC</option>
      </select>

      <button class="btn btn-primary" onclick="scrapeLinkedInJobs('gmp')">
        Scrape LinkedIn Jobs
      </button>
      
      <button class="btn btn-secondary" onclick="searchAllPlatforms('gmp')">
        Search Pharma Platforms (Google + ATS)
      </button>
    </div>

    <div id="gmp-results" class="results"></div>
  </div>

  <!-- TAB 3: AI OPTIMIZER -->
  <div id="optimizer-tab" class="tab-content">
    <div class="search-form">
      <label>Job Description</label>
      <textarea id="jobDescription" placeholder="Paste the complete job description here...

AI will extract technical skills, suggest similar job titles, and generate optimized searches."></textarea>

      <button class="btn btn-primary" onclick="optimizeJobDescription()" id="optimizeBtn">
        Analyze with AI
      </button>

      <div class="notice">
        <strong>How it works:</strong> AI analyzes the job description, extracts technical keywords and certifications, suggests similar job titles, then generates search links across all relevant platforms.
      </div>
    </div>

    <div id="optimizedResults"></div>
  </div>

</div>

<footer>
  <div>Find jobs before the crowd</div>
  <div style="margin-top:8px;">Powered by Google AI Studio</div>
</footer>

<script>
// Platform configurations
const AIML_PLATFORMS = {
  'Ashby': 'jobs.ashbyhq.com',
  'Greenhouse': 'boards.greenhouse.io',
  'Lever': 'jobs.lever.co',
  'Workday': 'myworkdayjobs.com',
  'SmartRecruiters': 'jobs.smartrecruiters.com',
  'Workable': 'jobs.workable.com',
  'Wellfound': 'wellfound.com',
  'YC Startups': 'workatastartup.com'
};

const GMP_PLATFORMS = {
  'Workday': 'myworkdayjobs.com',
  'iCIMS': 'icims.com',
  'Taleo': 'taleo.net',
  'SAP SuccessFactors': 'successfactors.com',
  'SmartRecruiters': 'jobs.smartrecruiters.com',
  'BioSpace': 'jobs.biospace.com',
  'PharmiWeb': 'pharmiweb.jobs',
  'ISPE Jobs': 'jobs.ispe.org',
  'PDA Careers': 'careers.pda.org'
};

const TIME_FILTERS = {
  '24hours': '&tbs=qdr:d',
  '48hours': '&tbs=qdr:h48',
  'week': '&tbs=qdr:w'
};

const LINKEDIN_TIME = {
  '24hours': 'r86400',
  '48hours': 'r172800',
  'week': 'r604800'
};

const AIML_LOCATIONS = {
  'usa': 'United States',
  'usa-remote': 'remote United States',
  'nyc': 'New York',
  'sf': 'San Francisco',
  'boston': 'Boston',
  'seattle': 'Seattle'
};

const GMP_LOCATIONS = {
  'usa': 'United States',
  'nj-philly': 'New Jersey',
  'research-triangle': 'Research Triangle',
  'boston': 'Boston',
  'houston': 'Houston',
  'maryland': 'Maryland'
};

const GMP_ROLE_TITLES = {
  'qa-associate': 'QA Associate OR "Quality Associate" OR "QA Shop Floor" OR "Quality Operations"',
  'doc-control': '"Document Control Specialist" OR "QA Documentation" OR "Batch Record"',
  'compliance': '"Compliance Specialist" OR "Quality Auditor" OR "Audit Specialist"',
  'qa-specialist': '"QA Specialist" OR "Quality Assurance Specialist"',
  'batch-release': '"Batch Release" OR "Batch Disposition" OR "Product Release"',
  'custom': ''
};

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`${tabName}-tab`).classList.add('active');
}

document.addEventListener('DOMContentLoaded', () => {
  const roleSelect = document.getElementById('gmp-roleType');
  if (roleSelect) {
    roleSelect.addEventListener('change', () => {
      const customField = document.getElementById('gmp-custom-field');
      customField.style.display = roleSelect.value === 'custom' ? 'block' : 'none';
    });
  }
  
  document.getElementById('aiml-jobTitle').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') scrapeLinkedInJobs('aiml');
  });
});

async function scrapeLinkedInJobs(tab) {
  let keywords, location, timeFilter, maxResults, resultsDiv;
  
  if (tab === 'aiml') {
    keywords = document.getElementById('aiml-jobTitle').value.trim();
    location = AIML_LOCATIONS[document.getElementById('aiml-locationFilter').value];
    timeFilter = LINKEDIN_TIME[document.getElementById('aiml-timeFilter').value];
    maxResults = parseInt(document.getElementById('aiml-jobCount').value);
    resultsDiv = document.getElementById('aiml-results');
  } else {
    const roleType = document.getElementById('gmp-roleType').value;
    if (roleType === 'custom') {
      keywords = document.getElementById('gmp-customTitle').value.trim();
    } else {
      keywords = GMP_ROLE_TITLES[roleType].split(' OR ')[0].replace(/"/g, '');
    }
    location = GMP_LOCATIONS[document.getElementById('gmp-locationFilter').value];
    timeFilter = LINKEDIN_TIME[document.getElementById('gmp-timeFilter').value];
    maxResults = parseInt(document.getElementById('gmp-jobCount').value);
    resultsDiv = document.getElementById('gmp-results');
  }

  if (!keywords) {
    alert('Please enter a job title');
    return;
  }

  const estimatedTime = Math.ceil(maxResults * 2.5);
  resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><div>Scraping ${maxResults} LinkedIn jobs and fetching details...<br>Estimated time: ${estimatedTime}-${estimatedTime + 10} seconds</div></div>`;

  try {
    const response = await fetch('/api/scrape-linkedin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        keywords: keywords,
        location: location,
        time_filter: timeFilter,
        max_results: maxResults,
        fetch_details: true
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      
      // Check if it's the Vercel limitation
      if (response.status === 503 && errorData.is_vercel) {
        throw new Error('LinkedIn scraping not available on this platform');
      }
      
      throw new Error(errorData.message || 'Failed to scrape LinkedIn');
    }

    const data = await response.json();
    displayJobCards(data.jobs, resultsDiv, tab, keywords, location, timeFilter);

  } catch (error) {
    console.error('Error:', error);
    
    // Check if it's a Vercel limitation error
    if (error.message && error.message.includes('not available')) {
      resultsDiv.innerHTML = `<div class="notice" style="border-left-color:#ffb84d;">
        <strong>LinkedIn Scraping Not Available</strong><br><br>
        LinkedIn scraping requires 2-5 minutes to fetch detailed job information, but this deployment platform has strict timeout limits.<br><br>
        <strong>Available Options:</strong><br>
        1. Use the "Search All Platforms" button below to search LinkedIn via Google<br>
        2. Run this application locally for full LinkedIn scraping: <code>python app.py</code>
      </div>`;
    } else {
      resultsDiv.innerHTML = `<div class="notice" style="border-left-color:var(--danger);">
        <strong>Error:</strong> ${error.message}<br><br>
        LinkedIn scraping failed. This could be due to rate limiting or connection issues.<br>
        Try using the "Search All Platforms" button instead, or wait a few minutes and try again.
      </div>`;
    }
  }
}

function displayJobCards(jobs, resultsDiv, tab, keywords, location, timeFilter) {
  if (!jobs || jobs.length === 0) {
    resultsDiv.innerHTML = '<div class="notice">No jobs found. Try adjusting your search criteria or use the "Search All Platforms" button.</div>';
    return;
  }

  // Count job types
  const externalCount = jobs.filter(j => j.external_apply_url).length;
  const easyApplyCount = jobs.length - externalCount;

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3>Found ${jobs.length} LinkedIn Jobs</h3>
      <div style="font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace;">
        ${externalCount} external • ${easyApplyCount} easy apply
      </div>
    </div>
    <div class="job-cards">`;

  jobs.forEach(job => {
    // Determine apply link and button style
    const applyUrl = job.external_apply_url || job.linkedin_url || job.link || '#';
    const isExternal = !!job.external_apply_url;
    const applyText = isExternal ? 'Apply on Company Site' : 'Easy Apply';
    const applyClass = isExternal ? 'job-apply-btn external' : 'job-apply-btn easy-apply';
    
    // Format posted date
    const postedDate = job.posted_date_formatted || job.posted_ago || job.posted_date || 'Recently';
    
    // Build job type line
    let jobTypeLine = '';
    const typeInfo = [];
    if (job.employment_type) typeInfo.push(job.employment_type);
    if (job.seniority_level) typeInfo.push(job.seniority_level);
    if (typeInfo.length > 0) {
      jobTypeLine = `<div class="job-type">${typeInfo.join(' • ')}</div>`;
    }
    
    // Description preview
    let descriptionPreview = '';
    if (job.description) {
      const preview = job.description.substring(0, 200).replace(/\n/g, ' ');
      descriptionPreview = `<div class="job-description-preview">${preview}...</div>`;
    }
    
    html += `
      <div class="job-card">
        <div class="job-title">${job.title}</div>
        <div class="job-company">${job.company}</div>
        <div class="job-location">${job.location}</div>
        ${jobTypeLine}
        ${descriptionPreview}
        <div class="job-footer">
          <div class="job-date">${postedDate}</div>
          <a href="${applyUrl}" target="_blank" class="${applyClass}">
            ${applyText}
          </a>
        </div>
      </div>
    `;
  });

  html += '</div>';
  resultsDiv.innerHTML = html;
}

function searchAllPlatforms(tab) {
  let keywords, location, timeFilter, platforms, resultsDiv;
  
  if (tab === 'aiml') {
    keywords = document.getElementById('aiml-jobTitle').value.trim();
    location = AIML_LOCATIONS[document.getElementById('aiml-locationFilter').value];
    timeFilter = document.getElementById('aiml-timeFilter').value;
    platforms = AIML_PLATFORMS;
    resultsDiv = document.getElementById('aiml-results');
  } else {
    const roleType = document.getElementById('gmp-roleType').value;
    if (roleType === 'custom') {
      keywords = document.getElementById('gmp-customTitle').value.trim();
    } else {
      keywords = GMP_ROLE_TITLES[roleType];
    }
    location = GMP_LOCATIONS[document.getElementById('gmp-locationFilter').value];
    timeFilter = document.getElementById('gmp-timeFilter').value;
    platforms = GMP_PLATFORMS;
    resultsDiv = document.getElementById('gmp-results');
  }

  if (!keywords) {
    alert('Please enter a job title');
    return;
  }

  resultsDiv.innerHTML = '';

  const timeParam = TIME_FILTERS[timeFilter] || '';
  const timeLabel = timeFilter.replace('hours', ' Hours').replace('week', ' Week');

  const header = document.createElement('h3');
  header.textContent = `${keywords.split(' OR ')[0].replace(/"/g, '')} — ${timeLabel}`;
  resultsDiv.appendChild(header);

  const list = document.createElement('ul');

  Object.entries(platforms).forEach(([name, site]) => {
    const li = document.createElement('li');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `${tab}-${name.replace(/\s/g, '-')}`;
    
    const label = document.createElement('label');
    label.htmlFor = checkbox.id;

    const googleQuery = tab === 'gmp' && keywords.includes('OR')
      ? `(${keywords}) GMP ${location} site:${site}`
      : `"${keywords}" ${location} site:${site}`;
    const url = `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}${timeParam}`;

    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.textContent = name;

    checkbox.addEventListener('click', () => window.open(url, '_blank'));
    link.addEventListener('click', (e) => {
      e.preventDefault();
      checkbox.checked = true;
      window.open(url, '_blank');
    });

    label.appendChild(link);
    li.appendChild(checkbox);
    li.appendChild(label);
    list.appendChild(li);
  });

  resultsDiv.appendChild(list);
}

async function optimizeJobDescription() {
  const jd = document.getElementById('jobDescription').value.trim();
  const btn = document.getElementById('optimizeBtn');
  const resultsDiv = document.getElementById('optimizedResults');

  if (!jd) {
    alert('Please paste a job description');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>AI is extracting keywords</div></div>';

  try {
    const response = await fetch('/api/optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobDescription: jd })
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();

    if (!data.keywords || !data.suggestedTitles) {
      throw new Error('Invalid response from AI');
    }

    resultsDiv.innerHTML = '';

    const keywordSection = document.createElement('div');
    keywordSection.className = 'optimized-section';

    const keywordHeader = document.createElement('h3');
    keywordHeader.textContent = 'Extracted Keywords';
    keywordSection.appendChild(keywordHeader);

    const chipContainer = document.createElement('div');
    chipContainer.className = 'keyword-chips';

    data.keywords.forEach(keyword => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = keyword;
      chipContainer.appendChild(chip);
    });

    keywordSection.appendChild(chipContainer);
    resultsDiv.appendChild(keywordSection);

    const isGMP = data.keywords.some(k => 
      k.toLowerCase().includes('gmp') || 
      k.toLowerCase().includes('veeva') || 
      k.toLowerCase().includes('batch') ||
      k.toLowerCase().includes('compliance')
    );

    const platformsToUse = isGMP ? GMP_PLATFORMS : AIML_PLATFORMS;

    const titleSection = document.createElement('div');
    const titleHeader = document.createElement('h3');
    titleHeader.textContent = 'Suggested Job Titles';
    titleHeader.style.fontSize = '15px';
    titleHeader.style.fontWeight = '600';
    titleHeader.style.marginBottom = '16px';
    titleSection.appendChild(titleHeader);

    data.suggestedTitles.forEach(title => {
      const card = document.createElement('div');
      card.className = 'job-title-card';

      const h4 = document.createElement('h4');
      h4.textContent = title;
      card.appendChild(h4);

      const subtitle = document.createElement('div');
      subtitle.className = 'subtitle';
      subtitle.textContent = `Click any platform to search (24 hours, USA) — ${isGMP ? 'Pharma' : 'Tech'} platforms`;
      card.appendChild(subtitle);

      const gridContainer = document.createElement('div');
      gridContainer.className = 'ats-grid';

      Object.entries(platformsToUse).forEach(([name, site]) => {
        const googleQuery = isGMP 
          ? `"${title}" GMP "United States" site:${site}`
          : `"${title}" "United States" site:${site}`;
        const url = `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}&tbs=qdr:d`;

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.className = 'ats-link';
        link.textContent = name;
        gridContainer.appendChild(link);
      });

      card.appendChild(gridContainer);
      titleSection.appendChild(card);
    });

    resultsDiv.appendChild(titleSection);

  } catch (error) {
    console.error('Error:', error);
    resultsDiv.innerHTML = `<div class="notice" style="border-left-color:var(--danger);">
      <strong>Error:</strong> ${error.message}<br><br>
      Make sure Flask is running: <code>python app.py</code>
    </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze with AI';
  }
}
</script>
