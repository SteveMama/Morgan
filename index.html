<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morgan Job Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --surface: #131a2b;
  --surface-2: #1a2340;
  --border: #243052;
  --text: #e8ecf4;
  --text-dim: #8892a8;
  --text-muted: #556180;
  --accent: #4de8b4;
  --accent-dim: #2a8c6a;
  --danger: #ff6b7a;
  --warning: #ffb84d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 14, 23, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 12px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.logo {
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--accent);
  text-transform: uppercase;
}

.logo span {
  color: var(--text-dim);
}

.tagline {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.tab {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text-dim);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.tab.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.tab:active {
  transform: scale(0.97);
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.search-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
}

label {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

input[type="text"],
select,
textarea {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
}

input[type="text"]:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--accent);
}

textarea {
  min-height: 180px;
  resize: vertical;
  line-height: 1.6;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  width: 100%;
}

.btn-primary:active {
  background: var(--accent-dim);
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.5;
  pointer-events: none;
}

.results {
  margin-top: 24px;
}

.results h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}

.results ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.results li {
  background: var(--surface);
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.results li input[type="checkbox"] {
  cursor: pointer;
  width: 16px;
  height: 16px;
}

.results li label {
  cursor: pointer;
  margin: 0;
  flex: 1;
  text-transform: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  letter-spacing: 0;
}

.results li a {
  color: var(--text);
  text-decoration: none;
  transition: color 0.2s;
}

.results li a:hover {
  color: var(--accent);
}

.notice {
  background: var(--surface-2);
  padding: 16px;
  border-radius: 10px;
  border-left: 3px solid var(--accent);
  margin: 20px 0;
  font-size: 13px;
  line-height: 1.6;
}

.notice strong {
  color: var(--accent);
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.optimized-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin: 20px 0;
}

.optimized-section h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--accent);
}

.keyword-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  display: inline-block;
  padding: 6px 12px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  font-family: 'DM Mono', monospace;
}

.job-title-section {
  margin-top: 24px;
}

.job-title-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}

.job-title-card h4 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.job-title-card .subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.ats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}

.ats-link {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.2s;
  text-align: center;
}

.ats-link:hover {
  background: var(--border);
  color: var(--accent);
  border-color: var(--accent);
}

.ats-link:active {
  transform: scale(0.97);
}

footer {
  text-align: center;
  margin-top: 60px;
  padding: 30px 20px;
  border-top: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}

footer a {
  color: var(--accent);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

@media (min-width: 640px) {
  .container {
    padding: 32px 40px;
  }

  .search-form {
    padding: 32px;
  }

  .ats-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">MORGAN <span>SEARCH</span></div>
      <div class="tagline">AI-powered job discovery</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('search')">Quick Search</button>
    <button class="tab" onclick="switchTab('optimizer')">AI Optimizer</button>
  </div>
</div>

<div class="container">

  <!-- TAB 1: QUICK SEARCH -->
  <div id="search-tab" class="tab-content active">
    <div class="search-form">
      <label>Job Title</label>
      <input type="text" id="jobTitle" placeholder="e.g., Machine Learning Engineer" />

      <label>Time Range</label>
      <select id="timeFilter">
        <option value="24hours" selected>Past 24 Hours</option>
        <option value="48hours">Past 48 Hours</option>
        <option value="72hours">Past 72 Hours</option>
        <option value="week">Past Week</option>
        <option value="month">Past Month</option>
      </select>

      <label>Location</label>
      <select id="locationFilter">
        <option value="usa" selected>United States</option>
        <option value="usa-remote">USA - Remote Only</option>
        <option value="nyc">New York</option>
        <option value="sf">San Francisco / Bay Area</option>
        <option value="boston">Boston</option>
        <option value="seattle">Seattle</option>
        <option value="austin">Austin</option>
      </select>

      <button class="btn btn-primary" onclick="generateJobLinks()">Search All Platforms</button>
    </div>

    <div id="searchResults" class="results"></div>
  </div>

  <!-- TAB 2: AI OPTIMIZER -->
  <div id="optimizer-tab" class="tab-content">
    <div class="search-form">
      <label>Job Description</label>
      <textarea id="jobDescription" placeholder="Paste the complete job description here...

The AI will extract:
- Technical skills and keywords
- Similar job titles to search
- Generate searches across all platforms"></textarea>

      <button class="btn btn-primary" onclick="optimizeJobDescription()" id="optimizeBtn">
        Analyze with AI
      </button>

      <div class="notice">
        <strong>How it works:</strong> AI analyzes the job description, extracts technical keywords, suggests similar job titles, then generates search links across 35+ job platforms.
      </div>
    </div>

    <div id="optimizedResults"></div>
  </div>

</div>

<footer>
  <div>Find jobs before the crowd</div>
  <div style="margin-top: 8px;">Powered by Google AI Studio / Gemini 2.5 Flash</div>
  <div style="margin-top: 12px;"><a href="https://github.com/yourusername/morgan" target="_blank">View on GitHub</a></div>
</footer>

<script>
const ATS_PLATFORMS = {
  'Ashby': 'jobs.ashbyhq.com',
  'Greenhouse': 'boards.greenhouse.io',
  'Lever': 'jobs.lever.co',
  'Workday': 'myworkdayjobs.com',
  'SmartRecruiters': 'jobs.smartrecruiters.com',
  'Workable': 'jobs.workable.com',
  'iCIMS': 'icims.com',
  'Jobvite': 'jobvite.com',
  'Dover': 'dover.io',
  'Pinpoint': 'pinpointhq.com',
  'BreezyHR': 'breezy.hr',
  'Wellfound': 'wellfound.com',
  'YC Startups': 'workatastartup.com',
  'Recruitee': 'recruitee.com',
  'Gusto': 'jobs.gusto.com',
  'Teamtailor': 'teamtailor.com',
  'Homerun': 'homerun.co',
  'JazzHR': 'applytojob.com',
  'Paylocity': 'recruiting.paylocity.com',
  'Oracle Cloud': 'oraclecloud.com',
  'Keka': 'keka.com',
  'CareerPuck': 'careerpuck.com',
  'TalentReef': 'jobappnetwork.com',
  'Gem': 'gem.com',
  'Trakstar': 'trakstar.com',
  'Cats': 'catsone.com',
  'ADP': 'workforcenow.adp.com OR site:myjobs.adp.com',
  'Rippling': 'rippling',
  'Notion': 'notion.site',
  'Builtin': 'builtin.com/job/',
  'Factorial': 'factorialhr.com',
  'TriNet': 'trinethire.com',
  'Jobs Subdomain': 'site:jobs.*',
  'Careers Pages': 'site:careers.* OR site:*/careers/*',
  'Employment Pages': 'site:*/employment/* OR site:*/opportunities/*'
};

const TIME_FILTERS = {
  '24hours': '&tbs=qdr:d',
  '48hours': '&tbs=qdr:h48',
  '72hours': '&tbs=qdr:h72',
  'week': '&tbs=qdr:w',
  'month': '&tbs=qdr:m'
};

const LOCATIONS = {
  'usa': 'United States',
  'usa-remote': 'remote United States',
  'nyc': 'New York',
  'sf': 'San Francisco OR "Bay Area"',
  'boston': 'Boston OR Cambridge',
  'seattle': 'Seattle',
  'austin': 'Austin'
};

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

  event.target.classList.add('active');
  document.getElementById(`${tabName}-tab`).classList.add('active');
}

function generateJobLinks() {
  const jobTitle = document.getElementById('jobTitle').value.trim();
  const timeFilter = document.getElementById('timeFilter').value;
  const location = document.getElementById('locationFilter').value;

  if (!jobTitle) {
    alert('Please enter a job title');
    return;
  }

  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';

  const timeParam = TIME_FILTERS[timeFilter] || '';
  const locationQuery = LOCATIONS[location];

  const header = document.createElement('h3');
  const timeLabel = timeFilter.replace('hours', ' Hours').replace('week', ' Week').replace('month', ' Month');
  header.textContent = `${jobTitle} — ${timeLabel}`;
  resultsDiv.appendChild(header);

  const list = document.createElement('ul');

  Object.entries(ATS_PLATFORMS).forEach(([name, site]) => {
    const li = document.createElement('li');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `${name.replace(/\s/g, '-')}-check`;

    const label = document.createElement('label');
    label.htmlFor = checkbox.id;

    let googleQuery;
    if (site.includes('OR')) {
      googleQuery = `"${jobTitle}" ${locationQuery} (site:${site})`;
    } else {
      googleQuery = `"${jobTitle}" ${locationQuery} site:${site}`;
    }

    const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}${timeParam}`;

    const link = document.createElement('a');
    link.href = googleUrl;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = name;

    checkbox.addEventListener('click', () => window.open(googleUrl, '_blank'));
    link.addEventListener('click', (e) => {
      e.preventDefault();
      checkbox.checked = true;
      window.open(googleUrl, '_blank');
    });

    label.appendChild(link);
    li.appendChild(checkbox);
    li.appendChild(label);
    list.appendChild(li);
  });

  resultsDiv.appendChild(list);
}

async function optimizeJobDescription() {
  const jd = document.getElementById('jobDescription').value.trim();
  const btn = document.getElementById('optimizeBtn');
  const resultsDiv = document.getElementById('optimizedResults');

  if (!jd) {
    alert('Please paste a job description');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>AI is extracting keywords</div></div>';

  try {
    const response = await fetch('/api/optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobDescription: jd })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data.keywords || !data.suggestedTitles) {
      throw new Error('Invalid response from AI');
    }

    resultsDiv.innerHTML = '';

    // Keywords section
    const keywordSection = document.createElement('div');
    keywordSection.className = 'optimized-section';

    const keywordHeader = document.createElement('h3');
    keywordHeader.textContent = 'Extracted Keywords';
    keywordSection.appendChild(keywordHeader);

    const chipContainer = document.createElement('div');
    chipContainer.className = 'keyword-chips';

    data.keywords.forEach(keyword => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = keyword;
      chipContainer.appendChild(chip);
    });

    keywordSection.appendChild(chipContainer);
    resultsDiv.appendChild(keywordSection);

    // Job titles section
    const titleSection = document.createElement('div');
    titleSection.className = 'job-title-section';

    const titleHeader = document.createElement('h3');
    titleHeader.textContent = 'Suggested Job Titles';
    titleHeader.style.fontSize = '15px';
    titleHeader.style.fontWeight = '600';
    titleHeader.style.marginBottom = '16px';
    titleSection.appendChild(titleHeader);

    data.suggestedTitles.forEach(title => {
      const card = document.createElement('div');
      card.className = 'job-title-card';

      const h4 = document.createElement('h4');
      h4.textContent = title;
      card.appendChild(h4);

      const subtitle = document.createElement('div');
      subtitle.className = 'subtitle';
      subtitle.textContent = 'Click any platform to search (24 hours, USA)';
      card.appendChild(subtitle);

      const gridContainer = document.createElement('div');
      gridContainer.className = 'ats-grid';

      Object.entries(ATS_PLATFORMS).forEach(([name, site]) => {
        let googleQuery;
        if (site.includes('OR')) {
          googleQuery = `"${title}" "United States" (site:${site})`;
        } else {
          googleQuery = `"${title}" "United States" site:${site}`;
        }

        const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}&tbs=qdr:d`;

        const link = document.createElement('a');
        link.href = googleUrl;
        link.target = '_blank';
        link.className = 'ats-link';
        link.textContent = name;
        gridContainer.appendChild(link);
      });

      card.appendChild(gridContainer);
      titleSection.appendChild(card);
    });

    resultsDiv.appendChild(titleSection);

  } catch (error) {
    console.error('Error:', error);
    resultsDiv.innerHTML = `<div class="notice" style="border-left-color: var(--danger);">
      <strong>Error:</strong> ${error.message}<br><br>
      Make sure Flask is running: <code>python app.py</code>
    </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze with AI';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('jobTitle').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') generateJobLinks();
  });
});
</script>
</body>
</html>
